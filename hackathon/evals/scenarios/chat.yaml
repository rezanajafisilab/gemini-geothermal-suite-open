  expect: {behaviour: answer, contains: ["{wellhead}"]}

# --- Labels: each cost by its own name --------------------------------------------------------

- id: B01_together
  group: labels
  after: CH00_base
  wordings:
    - What's the cost of heat and cold together?
    - Combined cost per MWh of heat and cold?
    - The overall cost per MWh delivered?
  expect: {behaviour: answer, contains: ["{lcoe}"]}

- id: B02_cold
  group: labels
  after: CH00_base
  wordings:
    - What does cold cost?
    - Cost of cooling per MWh?
    - How much is the cold per MWh?
  expect: {behaviour: answer, contains: ["{lcoc}"]}

- id: B03_heat_above_70
  group: labels
  after: CH00_base
  wordings:
    - Is the cost of heat above 70?
    - Does heat cost more than 70 €/MWh?
    - Heat under 70 euros a MWh?
  expect: {behaviour: answer, contains: ["{lcoh}"]}

# --- The plant options, read from words (3 Nov) ------------------------------------------------

- id: O01_free_cooling
  group: options
  after: CH00_base
  wordings:
    - What if the cooling towers cooled the network directly when it is cold outside?
    - Switch on free cooling and show me what it does to the cost of cold.
    - Would cooling with outside air in winter, before the chillers, help?
  expect: {behaviour: answer_or_design, contains_any: ["free cooling", "towers"]}

- id: O02_solar
  group: options
  after: CH00_base
  wordings:
    - What if we put 5 MWp of solar panels at the plant?
    - Add a 5 MWp PV field to the design and run it.
    - How would 5 MWp of our own solar change the cost and the CO2?
  expect: {behaviour: answer_or_design, contains_any: ["5 MWp", "solar"]}

- id: O03_tank
  group: options
  after: CH00_base
  wordings:
    - What if we add a 2,000 MWh hot-water store?
    - Give the plant a 2000 MWh heat storage tank.
    - Would a 2 GWh buffer tank cut the boiler's gas?
  expect: {behaviour: answer_or_design, contains_any: ["store", "tank", "MWh"]}

- id: O04_ht_ates
  group: options
  after: CH00_base
  wordings:
    - What if we kept summer heat for winter in a 28,000 MWh aquifer store?
    - Add a seasonal HT-ATES of 28,000 MWh.
    - Could a high-temperature aquifer storage of 28 GWh replace some of the boiler?
  expect: {behaviour: answer_or_design, contains_any: ["aquifer", "HT-ATES", "seasonal", "store"]}

- id: O05_second_aquifer
  group: options
  after: CH00_base
  wordings:
    - What if there is a second aquifer at 3,200 m, 40 m thick with 400 mD?
    - Try a second reservoir at 3200 m depth, 40 m and 400 millidarcy.
    - Suppose another sandstone sits at 3,200 m (40 m, 400 mD). Does it help?
  expect: {behaviour: answer_or_design, contains_any: ["3,200", "3200", "second aquifer"]}

- id: O06_grid_by_month
  group: options
  after: CH00_base
  wordings:
    - Count the grid's CO2 month by month instead of one yearly figure.
    - What changes if winter electricity is dirtier than summer's?
    - Use a seasonal grid emission factor and show the CO2 again.
  expect: {behaviour: answer_or_design, contains_any: ["CO2", "CO₂", "month"]}

# --- What a reply needs (3 Nov) ----------------------------------------------------------------

- id: N01_another_design
  group: needs
  after: CH00_base
  confirm: false
  wordings:
    - I want to do another design.
    - Let me set up a new design myself.
    - Can we start over with different inputs?
  expect: {behaviour: clarify}

- id: N02_how_found
  group: needs
  after: CH00_base
  may_name: ["{cheapest}", "{reliable}", "{co2}", "{chosen}"]
  wordings:
    - How did you arrive at this design?
    - Show me the designs you tried before picking this one.
    - What did the search go through to get here?
  # Not "design" or "search": the question says them, and "I only ran one design" passed (4 Nov).
  expect: {behaviour: answer, contains_any: ["layout", "candidate", "tried", "sizing", "compared", "evaluated"]}

- id: N03_side_by_side
  group: needs
  after: CH00_base
  may_name: ["{cheapest}", "{reliable}", "{co2}", "{chosen}"]
  wordings:
    - Put the picks side by side.
    - Compare the cheapest with the most reliable design.
    - Show me the designs next to each other.
  expect: {behaviour: answer, contains_any: ["€/MWh", "cheapest", "reliable"]}
