    - What are the maintenance dates?
    - Which days is the doublet off?
  expect: {behaviour: answer, contains: ["{stop_from}"]}

- id: V02_gas_bought
  group: values
  after: CH00_base
  wordings:
    - How much gas does the plant buy a year?
    - What's the yearly gas purchase?
    - Gas bought per year?
  expect: {behaviour: answer, contains_any: [GWh]}

- id: V03_boiler_share
  group: values
  after: CH00_base
  wordings:
    - How much of the heat comes from the gas boiler?
    - What share of the heat does the boiler give?
    - Boiler share of the heat?
  expect: {behaviour: answer, contains: ["{boiler_share}"]}

- id: V04_depth
  group: values
  after: CH00_base
  wordings:
    - How deep are the wells?
    - Well depth?
    - To what depth do you drill?
  expect: {behaviour: answer, contains: ["{depth}"]}

- id: V05_gas_share_of_cost
  group: values
  after: CH00_base
  wordings:
    - What share of the yearly cost is gas?
    - How much of the cost is gas?
    - Gas as a share of the yearly cost?
  expect: {behaviour: answer, contains_any: ["%"]}

- id: V06_wellhead
  group: values
  after: CH00_base
  wordings:
    - How hot is the brine at the wellhead?
    - Wellhead temperature?
