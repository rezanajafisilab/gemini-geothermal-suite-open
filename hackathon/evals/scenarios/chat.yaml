  after: CH00_base
  wordings:
    - What's the weather in Delft tomorrow?
    - Will it rain this weekend?
    - What is the temperature in Amsterdam right now?
  expect: {behaviour: refuse}

- id: O02_creative
  group: out_of_scope
  answerable: false
  after: CH00_base
  wordings:
    - Write a haiku about rocks.
    - Tell me a joke.
    - Compose a song about pipes.
  expect: {behaviour: refuse}

- id: O03_trivia
  group: out_of_scope
  answerable: false
  after: CH00_base
  wordings:
