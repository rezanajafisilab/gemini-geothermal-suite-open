  expect: {behaviour: design}
  checks: [reliable_pick, verifier_pass, numbers_grounded, hard_caps, known_totals]

- id: S58_dutch_failure
  prompt: Wat gebeurt er als de warmtepomp in februari uitvalt?
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [failure_run, failure_unit_heat_pump]

- id: S59_failure_cheapest
  prompt: What if the boiler of the cheapest design trips for three weeks in January?
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [failure_run, numbers_grounded]

- id: S60_compare_by_name
  prompt: how does A1 stack up against A2?
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [compared, numbers_grounded]


# Added 3 Nov (evening): the known values of the challenge district, from its demand files
# (unit_test/dioscuri_plant/test_year.py): the answer must be right, not only well behaved.
- id: S61_known_demand
  prompt: How much heat and cold does the district need in a year, and what is its peak heat demand?
  expect: {behaviour: answer, contains: ["111.67", "23.74", "30 MW"]}
  checks: [numbers_grounded]

- id: S62_delivers_the_year
  prompt: Over the year, how much heat and cold does the recommended design deliver, against the demand?
  after: S01_full_brief
  expect: {behaviour: answer, contains: ["111.67", "23.74"]}
  checks: [numbers_grounded]

# Added 3 Nov (evening): bad input data. A rival agent found errors in its case file and asked
# instead of guessing; these feed ours bad files and values. Each must be flagged or asked
# about, never guessed (badinput.py makes the project as the New project dialog does).
- id: S63_year_of_364_days
  upload:
    name: Short year
    heat: hackathon/evals/scenarios/fixtures/heating_364_days.csv
    cool: src/gemini_agent/data/challenge/GEMINI_Cooling_Demand_Daily_2027.csv
  prompt: Design a geothermal heating and cooling system for this district.
  # 31 December is missing: the file is refused, saying how many days it has and needs.
  expect: {behaviour: upload_rejected, contains: ["364", "365"]}
  checks: [upload_rejected]

- id: S64_kw_without_unit_asks
  upload:
    name: District in kW
    heat: hackathon/evals/scenarios/fixtures/heating_no_unit.csv
    cool: src/gemini_agent/data/challenge/GEMINI_Cooling_Demand_Daily_2027.csv
  prompt: Design a geothermal heating and cooling system for this district.
  # The challenge's heat in kW, in a column that names no unit (peak 30,000): read as MW it
  # would be a 30 GW district. The app asks which unit it is; nothing is made until then.
  expect: {behaviour: clarify, must_ask: [heat_unit], contains: ["30,000", "30.0 MW"]}
  checks: [upload_asks_unit]

- id: S65_kw_answered
  upload:
    name: District in kW
    heat: hackathon/evals/scenarios/fixtures/heating_no_unit.csv
    cool: src/gemini_agent/data/challenge/GEMINI_Cooling_Demand_Daily_2027.csv
    answers: {heat_unit: kW}
  known_demand: true  # the challenge's demand, so its known totals hold
  prompt: Design a geothermal heating and cooling system for this district.
  expect: {behaviour: design}
  checks: [upload_asks_unit, upload_made, verifier_pass, hard_caps, known_totals]

- id: S66_cooling_return_colder_upload
  upload:
    name: Cold return
    heat: src/gemini_agent/data/challenge/GEMINI_Heating_Demand_Daily_2027.csv
    cool: src/gemini_agent/data/challenge/GEMINI_Cooling_Demand_Daily_2027.csv
    values: {cool_supply_c: 20, cool_return_c: 15}
  prompt: Design a geothermal heating and cooling system for this district.
  expect: {behaviour: upload_rejected, contains: ["warmer"]}
  checks: [upload_rejected]

- id: S67_cooling_return_colder_whatif
  prompt: What if the cooling return is 16 °C?
  after: S01_full_brief
  # Below the 20 °C supply: not run, said, and asked which value was meant.
  expect: {behaviour: answer_or_clarify, contains_any: ["warmer than its supply", "warmer than the supply"]}
  checks: [no_return_below_supply]

- id: S68_cooling_return_colder_design
  prompt: Our cooling network returns at 15 °C. Design the plant for {site}.
  expect: {behaviour: clarify_or_design, contains_any: ["warmer than its supply", "warmer than the supply"]}
  checks: [no_return_below_supply]

- id: S69_flow_400_whatif
  prompt: What if we run each doublet at 400 m³/h?
  after: S01_full_brief
  # The flow what-if takes up to 1,000 m³/h; the verifier holds the design to the challenge's
  # 300, and the reply must say the request breaks it.
  expect: {behaviour: design_or_answer, contains_any: ["300 m³/h", "300 m3/h"]}
  checks: [flow_cap_said]

- id: S70_flow_400_design
  prompt: Design the plant for {site} with each doublet producing 400 m³/h.
  expect: {behaviour: design_or_clarify, contains_any: ["300 m³/h", "300 m3/h"]}
  checks: [flow_cap_said]
