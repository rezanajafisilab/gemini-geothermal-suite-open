  after: S01_full_brief
  expect: {behaviour: design}
  checks: [changes_read, numbers_grounded, verifier_pass, hard_caps, known_totals]

- id: S48_formula
  prompt: Write the heat the brine gives as a formula with its symbols.
  after: S01_full_brief
  expect: {behaviour: answer, contains: ["$"]}
  checks: [model_wrote_it]

- id: S49_gemini_tab
  prompt: what does the GEMINI project tab show, and why is there a separator and a splitter?
  after: S01_full_brief
  expect: {behaviour: answer, contains_any: ["separator", "splitter"]}
  checks: [model_wrote_it, numbers_grounded]

- id: S50_why_not_two_injectors
  prompt: why not two injectors per doublet?
  after: S01_full_brief
  expect: {behaviour: answer, contains_any: ["€/MWh", "EUR/MWh", "M€"]}
  checks: [model_wrote_it, numbers_grounded]

# Added 1 Nov: failures, picks, comparisons and requests of several steps. The reasoning model
# reads what is asked (no phrase is matched by code); several wordings of each, Dutch too.
- id: S51_failure_dated
  prompt: What happens if the ESP of doublet 1 fails from 10 to 24 January? Would a spare help?
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [failure_run, numbers_grounded]

- id: S52_outage_no_dates
  prompt: can we still keep everyone warm if we lose a production pump?
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [failure_run, numbers_grounded]

- id: S53_failure_duration
  prompt: suppose the heat pump breaks down for two weeks, what then?
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [failure_run, failure_unit_heat_pump, numbers_grounded]

- id: S54_compare_picks
  prompt: Compare the cheapest design with the most reliable one
  after: S01_full_brief
  expect: {behaviour: answer_or_design}
  checks: [compared, numbers_grounded]

- id: S55_several_steps
  prompt: Design it, then check it with the reservoir 10 °C colder, and tell me if the pick changes
  expect: {behaviour: design}
  checks: [several_steps, numbers_grounded, verifier_pass, hard_caps, known_totals]

- id: S56_cheapest
  prompt: Give me the cheapest plant you can find for {site}.
  expect: {behaviour: design}
  checks: [ranked_by_cost, verifier_pass, numbers_grounded, hard_caps, known_totals]

- id: S57_keeps_running
